<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karaoke Battle — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ============ DESIGN SYSTEM — Karaoke Battle ============ */
  :root {
    /* Base neutrals — deep cool-violet near-black */
    --bg:        oklch(0.15 0.018 295);
    --bg-2:      oklch(0.18 0.022 295);
    --surface:   oklch(0.215 0.024 293);
    --surface-2: oklch(0.255 0.026 292);
    --line:      oklch(0.34 0.028 292);
    --line-soft: oklch(0.30 0.024 292 / 0.6);
    --text:      oklch(0.97 0.006 290);
    --text-dim:  oklch(0.72 0.018 290);
    --text-faint:oklch(0.56 0.020 290);

    /* Neon accents — shared chroma/lightness, varied hue */
    --magenta: oklch(0.72 0.205 350);
    --cyan:    oklch(0.78 0.135 205);
    --lime:    oklch(0.85 0.205 130);
    --amber:   oklch(0.82 0.165 70);
    --violet:  oklch(0.72 0.175 295);
    --rose:    oklch(0.74 0.175 18);
    --spotify: oklch(0.74 0.17 152);

    /* Primary accent (tweakable) */
    --accent:  var(--magenta);
    --accent-2: var(--cyan);

    --radius:  18px;
    --radius-sm: 12px;
    --radius-lg: 26px;

    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, monospace;

    --shadow: 0 10px 40px -12px rgba(0,0,0,0.7);
    --app-w: 430px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(120% 80% at 15% 0%, oklch(0.24 0.05 350 / 0.35), transparent 60%),
      radial-gradient(120% 90% at 95% 10%, oklch(0.24 0.05 205 / 0.30), transparent 55%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* Color helper classes for teams/accents */
  .tc-magenta { --tc: var(--magenta); }
  .tc-cyan    { --tc: var(--cyan); }
  .tc-lime    { --tc: var(--lime); }
  .tc-amber   { --tc: var(--amber); }
  .tc-violet  { --tc: var(--violet); }
  .tc-rose    { --tc: var(--rose); }

  /* ============ App shell / phone ============ */
  #root { height: 100%; }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .phone {
    width: var(--app-w);
    max-width: 100%;
    height: min(932px, calc(100vh - 44px));
    background: var(--bg);
    border-radius: 46px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow), 0 0 0 10px oklch(0.10 0.01 290), 0 0 0 11px oklch(0.30 0.02 290);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 480px) {
    .stage { padding: 0; }
    .phone { border-radius: 0; height: 100vh; box-shadow: none; border: none; }
  }

  /* status bar */
  .statusbar {
    height: 44px; flex: 0 0 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; font-size: 13px; font-weight: 600;
    color: var(--text); letter-spacing: 0.02em;
    z-index: 5;
  }
  .statusbar .dots { display: flex; gap: 5px; align-items: center; }
  .statusbar .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }

  /* scrollable screen body */
  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen::-webkit-scrollbar { width: 0; }
  .screen-pad { padding: 8px 20px 120px; }

  /* ============ Typography ============ */
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-faint);
  }
  h1.title { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; }
  h2.title { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 14px; line-height: 1.5; }

  /* ============ Buttons ============ */
  .btn {
    appearance: none; border: none; cursor: pointer; font-family: var(--font-display);
    font-weight: 600; font-size: 15px; border-radius: var(--radius-sm);
    padding: 14px 18px; display: inline-flex; align-items: center; justify-content: center;
    gap: 9px; transition: transform .12s ease, filter .15s ease, background .15s ease;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn.block { width: 100%; }
  .btn-primary {
    background: var(--accent); color: oklch(0.16 0.02 295); border: none;
    box-shadow: 0 0 0 1px color-mix(in oklch, var(--accent), white 20%), 0 8px 30px -8px var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover { background: var(--surface); }
  .btn-sm { padding: 9px 13px; font-size: 13px; border-radius: 10px; }
  .btn-icon { padding: 0; width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============ Cards & surfaces ============ */
  .card {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card.glass {
    background: oklch(0.22 0.024 293 / 0.7);
    backdrop-filter: blur(12px);
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--text-dim); background: var(--bg-2);
  }
  .chip.on { color: oklch(0.16 0.02 295); background: var(--tc, var(--accent)); border-color: transparent; font-weight: 700; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc, var(--accent)); flex: 0 0 9px;
         box-shadow: 0 0 8px var(--tc, var(--accent)); }

  /* ============ Inputs ============ */
  .input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 13px 14px; color: var(--text);
    font-family: var(--font-body); font-size: 15px; outline: none;
    transition: border-color .15s ease;
  }
  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--text-faint); }

  /* ============ Bottom nav ============ */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 78px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: stretch; gap: 2px;
    background: oklch(0.16 0.018 295 / 0.86);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--line-soft);
    z-index: 20;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; border: none; background: none; cursor: pointer; color: var(--text-faint);
    font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
    border-radius: 14px; transition: color .15s ease;
  }
  .tab .ico { font-size: 19px; line-height: 1; }
  .tab.active { color: var(--accent); }

  /* ============ Sheets / modal ============ */
  .overlay-layer {
    position: absolute; inset: 0; z-index: 50; pointer-events: none;
  }
  .overlay-layer > * { pointer-events: auto; }
  .sheet-scrim {
    position: absolute; inset: 0; background: oklch(0.06 0.01 290 / 0.66);
    z-index: 40; display: flex; align-items: flex-end;
  }
  .sheet {
    width: 100%; background: var(--bg-2); border-top-left-radius: 28px; border-top-right-radius: 28px;
    border-top: 1px solid var(--line); padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88%; overflow-y: auto;
  }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 14px; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  /* ============ Board grid ============ */
  .board {
    display: grid; gap: 7px; width: 100%;
  }
  .cell {
    aspect-ratio: 1 / 1; border-radius: 11px; border: 1px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 6px; font-size: 10px; line-height: 1.18; font-weight: 500;
    color: var(--text-dim); cursor: pointer; position: relative; overflow: hidden;
    transition: transform .1s ease, border-color .15s ease;
  }
  .cell:active { transform: scale(0.95); }
  .cell.marked {
    background: var(--tc, var(--lime)); color: oklch(0.16 0.02 295); border-color: transparent;
    font-weight: 700;
  }
  .cell.free { background: var(--surface-2); border-style: dashed; }

  .util { color: var(--text-dim); }
  .mono { font-family: var(--font-mono); }
  .glow-text { text-shadow: 0 0 18px color-mix(in oklch, var(--accent), transparent 45%); }

  /* segmented */
  .seg { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; border: none; background: none; color: var(--text-dim); cursor: pointer;
    font-family: var(--font-display); font-weight: 600; font-size: 13px; padding: 9px 6px; border-radius: 9px;
    transition: all .15s ease;
  }
  .seg button.on { background: var(--accent); color: oklch(0.16 0.02 295); }

  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; }

  /* toggle */
  .switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s ease; flex: 0 0 46px; }
  .switch.on { background: var(--accent); }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; transition: transform .2s ease; }
  .switch.on .knob { transform: translateX(18px); }

  .divider { height: 1px; background: var(--line-soft); margin: 16px 0; border: none; }

  /* ============ PRINT ============ */
  #print-root { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff !important; overflow: visible !important; }
    .stage, .phone, .tweak-host { display: none !important; }
    #print-root { display: block !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="print-root"></div>

  <template id="__bundler_thumbnail">

      <rect width="100" height="100" fill="#1a1430"/>
      <circle cx="50" cy="42" r="16" fill="none" stroke="#ff4d9d" stroke-width="3"/>
      <rect x="46" y="42" width="8" height="30" rx="4" fill="#2dd4d4"/>
      <rect x="36" y="70" width="28" height="6" rx="3" fill="#a3e635"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="live.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
